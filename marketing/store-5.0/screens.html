<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unifesto 5.0 store screenshots</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="frame.css">
</head>
<body>
<script src="glyphs.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
<script>
/* Sizes: page px, caption, and the device the app sits in (app laid out in points, --k scales it). */
const SIZES = {
  iphone:  { w: 1320, h: 2868, pad: 110, capTop: 150, cap: 104, devTop: 500, ptW: 440, ptH: 956, k: 2.36, bezel: 26, r: 160 },
  play:    { w: 1080, h: 1920, pad: 90,  capTop: 110, cap: 76,  devTop: 420, ptW: 440, ptH: 956, k: 1.52, bezel: 18, r: 104 },
  ipad:    { w: 2064, h: 2752, pad: 170, capTop: 170, cap: 118, devTop: 520, ptW: 1032, ptH: 1376, k: 1.55, bezel: 34, r: 90 },
  tab:     { w: 1440, h: 2560, pad: 120, capTop: 140, cap: 92,  devTop: 460, ptW: 800,  ptH: 1280, k: 1.5,  bezel: 28, r: 70 },
};
const size = new URLSearchParams(location.search).get('size') || 'iphone';

function page(s, screen) {
  const cap = screen.cap.replace(/\*(.+?)\*/g, '<em>$1</em>');
  const el = document.createElement('section');
  el.className = 'page';
  el.style.cssText = `--w:${s.w}px;--h:${s.h}px;--pad:${s.pad}px;--cap-top:${s.capTop}px;--cap:${s.cap}px;--dev-top:${s.devTop}px;` +
    `--pt-w:${s.ptW};--pt-h:${s.ptH};--k:${s.k};--bezel:${s.bezel}px;--dev-r:${s.r}px`;
  el.innerHTML = `<div class="stars"></div><div class="stars-far"></div><div class="orbit a"></div><div class="orbit b"></div>
    <div class="glow"></div><div class="edge"></div>
    <div class="cap">${cap}</div>
    <div class="device"><div class="screen"><div class="app ${size === 'ipad' || size === 'tab' ? 'tablet' : ''}">${App.render(screen.id, size)}</div></div></div>
    <div class="grain"></div>`;
  return el;
}

const s = SIZES[size];
if (s) for (const screen of App.screens) document.body.appendChild(page(s, screen));
if (size === 'feature') document.body.appendChild(App.feature());
if (size === 'header' || size === 'search') document.body.appendChild(App.creative(size));
document.fonts.ready.then(() => { window.ready = true; });
</script>
</body>
</html>
