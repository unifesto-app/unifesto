name: unifesto

# Full stack behind Caddy, which terminates HTTPS with a Cloudflare Origin
# Certificate (./certs, server-only) and routes each hostname to its
# container. The mobile app is intentionally not containerised (it ships
# via Expo/EAS).
#
#   api.unifesto.app    -> backend:8080 (3 replicas)
#   apex.unifesto.app   -> apex:3000
#   space.unifesto.app  -> space:3000
#   unifesto.app / www  -> web:3000
#
# Runtime secrets come from each app's own env file (backend/.env,
# websites/apex/.env, websites/space/.env, websites/web/.env.local).
# Build-time NEXT_PUBLIC_* values are inlined into the client bundles, so
# they're passed as build args interpolated from ./.env (NEXT_PUBLIC_BACKEND_URL,
# NEXT_PUBLIC_API_URL, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, SENTRY_DSN_{WEB,SPACE,APEX}).
#
# Images: compose runs :latest. deploy.sh also tags every build :<git sha> and
# the image it replaced :previous; `./deploy.sh rollback` puts :previous back
# on :latest (J13). The deployed SHA is in DEPLOYED_SHA next to this file.

# Every container's stdout goes to Docker's json-file driver, which never
# rotated: one chatty replica could fill the disk. 5 x 10 MB per container.
# The CERT-In access record is Caddy's own file log (see Caddyfile), not this.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - apex
      - space
      - web

  # One-shot: apply DB migrations exactly once before the API replicas start,
  # so the replicas don't race to run `prisma migrate deploy` concurrently on
  # boot. Runs, migrates, exits. `restart: "no"` — it is not a long-lived svc.
  backend-migrate:
    build: &backend-build
      context: ./backend
      # Baked into the image as SENTRY_RELEASE, so a rollback image reports its
      # own release. deploy.sh passes the git SHA; a manual build leaves it unset.
      args:
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    image: unifesto-backend:latest
    restart: "no"
    logging: *logging
    volumes:
      - ./backend/.env:/app/.env:ro
    entrypoint: ["npx", "prisma", "migrate", "deploy"]

  backend:
    build: *backend-build
    image: unifesto-backend:latest
    restart: unless-stopped
    logging: *logging
    # NOTE: we mount .env instead of using `env_file:` — the app (NestJS
    # ConfigModule) and `prisma.config.ts` load it with the tolerant dotenv
    # parser. Compose's env_file parser rejects the multi-line PRIVATE KEY.
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      # Migrations already ran in the backend-migrate one-shot; replicas must
      # not each try to migrate on boot.
      RUN_MIGRATIONS: "false"
      # Cap the V8 heap so a memory-heavy path (node-canvas certificate/PDF
      # rendering) can't balloon a replica and OOM the shared 4 GB host.
      NODE_OPTIONS: "--max-old-space-size=512"
      # Certificate renders run only in `cert-worker` (below), never on a
      # replica serving traffic.
      CERT_WORKER: "false"
    expose:
      - "8080"
    # Healthcheck: deploy.sh waits for `healthy` before draining an old replica,
    # and `autoheal` (below) restarts a replica that turns `unhealthy` (wedged
    # event loop). Docker's embedded DNS does NOT drop unhealthy
    # containers outside swarm mode, so this alone keeps nothing out of Caddy's
    # rotation; Caddy's passive check ejects a replica whose dials fail. `node -e`
    # because the slim image ships no curl/wget. `start_period` covers Nest boot
    # (Prisma + Redis connect); a 5xx or connect error counts as unhealthy.
    labels:
      autoheal: "true"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    # SIGTERM -> Nest enableShutdownHooks closes the HTTP server and BullMQ
    # worker; give in-flight requests and a running cert render time to finish
    # before Docker sends SIGKILL (default was 10s). deploy.sh rolls replicas,
    # so the old ones drain while the new ones already serve.
    stop_grace_period: 60s
    # Host is t3.large (2 vCPU / 8 GB) shared with Caddy + 4 Next.js apps.
    # Three API replicas fit the 8 GB comfortably (3 x 1G cap = 3 GB) and give
    # more concurrency headroom than the 2 vCPUs alone; the extra replica
    # absorbs bursts and the CPU-blocking cert/PDF paths. The app is stateless
    # (JWT, Redis-backed throttler + Socket.IO Redis adapter, external Postgres),
    # so it scales horizontally. Keep (replicas x Prisma connection_limit) under
    # Postgres max_connections — currently 3 x 10 = 30.
    #
    # Memory cap is 1G (raised from 700M): certificate/PDF rendering uses
    # @napi-rs/canvas (Skia), whose buffers live in NATIVE memory OUTSIDE the V8
    # heap, so `--max-old-space-size` does not bound them. A large issuance batch
    # was pushing RSS past 700M and getting OOM-killed (the "connection refused"
    # gaps in the Caddy log). The durable fix is to move issuance onto a
    # background queue + bound render concurrency; this headroom is the interim.
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G

  # Certificate render worker (S20). Same image as the API, but the only
  # process that consumes the BullMQ certificate queue, so Skia's native memory
  # spikes are bounded by THIS container's limit and an OOM here never takes an
  # API replica down (jobs retry). Not routed by Caddy (different service name).
  # deploy.sh recreates it whenever the backend is deployed.
  cert-worker:
    image: unifesto-backend:latest
    restart: unless-stopped
    logging: *logging
    labels:
      autoheal: "true"
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      RUN_MIGRATIONS: "false"
      NODE_OPTIONS: "--max-old-space-size=512"
      CERT_WORKER: "true"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    # A running render finishes (or BullMQ retries it) before SIGKILL.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M

  # Restarts any container labelled `autoheal: "true"` once its healthcheck
  # reports `unhealthy` (3 failed probes). Docker itself never acts on health
  # outside swarm: `restart: unless-stopped` only fires when the process exits,
  # and a wedged Node process doesn't exit. A healthcheck that kills PID 1 can't
  # do it either (PID 1 ignores signals it has no handler for, and a wedged loop
  # never runs its SIGTERM handler). The docker.sock mount is root-equivalent on
  # the host; the image is a ~50-line shell script, pinned.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    logging: *logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
      # Matches the services' stop_grace_period, so a restart still drains.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 32M

  apex:
    build:
      context: ./websites/apex
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_APEX:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      secrets:
        - sentry_auth_token
    image: unifesto-apex:latest
    restart: unless-stopped
    logging: *logging
    env_file: ./websites/apex/.env
    expose:
      - "3000"
    depends_on:
      - backend
    # Measured ~80 MB resident (2026-10-18); the cap keeps a leak from
    # starving the API replicas on the shared 8 GB host.
    deploy:
      resources:
        limits:
          memory: 384M

  # Frozen on its last image (Track V2): the console's source moved into web
  # (www.unifesto.app/console), so there is nothing left here to build. It keeps
  # serving space.unifesto.app until V3 points that host at www; V4 removes it.
  space:
    image: unifesto-space:latest
    restart: unless-stopped
    logging: *logging
    env_file: ./websites/space/.env
    expose:
      - "3000"
    depends_on:
      - backend
    # Measured ~80 MB resident (2026-10-18).
    deploy:
      resources:
        limits:
          memory: 384M

  web:
    build:
      context: ./websites/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        # K18: Google sign-in on the web; empty keeps the button hidden.
        NEXT_PUBLIC_COGNITO_DOMAIN: ${WEB_COGNITO_DOMAIN:-}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${WEB_COGNITO_CLIENT_ID:-}
        # "1" once Cognito has Sign in with Apple; empty keeps that button hidden.
        NEXT_PUBLIC_APPLE_SIGNIN: ${WEB_APPLE_SIGNIN:-}
        # The console (Track V). The Maps key is the browser key space used.
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_APEX_URL: ${NEXT_PUBLIC_APEX_URL:-}
      secrets:
        - sentry_auth_token
    image: unifesto-web:latest
    restart: unless-stopped
    logging: *logging
    env_file: ./websites/web/.env.local
    environment:
      # SSR calls the API over the Docker network (skips Cloudflare + Caddy).
      # Only used once INTERNAL_API_KEY is set in websites/web/.env.local and
      # the same value in backend/.env (see src/lib/api/internal.ts); without
      # it every SSR render shares one throttle bucket. deploy.sh refuses to
      # run until both files carry the same key.
      API_INTERNAL_URL: http://backend:8080
    expose:
      - "3000"
    depends_on:
      - backend
    # Measured ~145 MB resident (2026-10-18); SSR + ISR cache, so more headroom.
    deploy:
      resources:
        limits:
          memory: 768M

# Build-only secret for the Sentry source-map upload (apex, space, web). Read from
# SENTRY_AUTH_TOKEN in ./.env; it never reaches a runtime container or image.
secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

volumes:
  caddy_data:
  caddy_config:
