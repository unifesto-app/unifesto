# Local dev databases only (J14), so a laptop never needs the prod RDS/Redis.
#   docker compose -f docker-compose.dev.yml up -d
# Pairs with backend/.env.development.example. Not used by deploy.sh.
name: unifesto-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unifesto
      POSTGRES_PASSWORD: unifesto
      POSTGRES_DB: unifesto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
