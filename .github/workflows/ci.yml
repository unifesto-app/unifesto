# Status checks for every PR and push to main. Each job only runs when its app
# (or this file) changed; the "CI passed" job is the single required check, and
# it passes when every job either succeeded or was skipped as unaffected.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The org's default token is restricted; paths-filter needs to list PR files.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
      space: ${{ steps.filter.outputs.space }}
      apex: ${{ steps.filter.outputs.apex }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            backend:
              - *ci
              - 'backend/**'
            mobile:
              - *ci
              - 'mobile/**'
            web:
              - *ci
              - 'websites/web/**'
            space:
              - *ci
              - 'websites/space/**'
            apex:
              - *ci
              - 'websites/apex/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Dummy values only: some services build Razorpay/S3 clients in their
    # constructors from process.env. Locally these come from backend/.env.
    env:
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-not-a-secret
      RAZORPAY_WEBHOOK_SECRET: ci-not-a-secret
      AWS_REGION: ap-south-1
      S3_BUCKET_NAME: ci-bucket
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations have no destructive SQL without review
        # New migrations must be additive. DROP COLUMN / DROP TABLE fails the
        # build unless the file carries a `-- contract-step` comment (the
        # reviewed second half of an expand/contract change). Other destructive
        # SQL only warns. See remove_chat, 2026-09-25 (S37).
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}" -- 'backend/prisma/migrations/*/migration.sql' || true)
          [ -z "$added" ] && { echo "No new migrations."; exit 0; }
          echo "New migrations:"; echo "$added"
          failed=0
          for f in $added; do
            if grep -niE '\bDROP\s+(TABLE|COLUMN)\b' "$f"; then
              if grep -qiE '^\s*--\s*contract-step\b' "$f"; then
                echo "::warning file=$f::DROP in a marked contract step. Read it before deploying."
              else
                echo "::error file=$f::DROP COLUMN/TABLE in a new migration. Make it additive, or mark a reviewed contract step with a '-- contract-step' comment."
                failed=1
              fi
            fi
            if grep -niE '\bDROP\s+(TYPE|INDEX|CONSTRAINT)|ALTER\s+COLUMN\s+.*\s+TYPE\b|TRUNCATE' "$f"; then
              echo "::warning file=$f::Destructive SQL in a new migration. Read it before deploying."
            fi
          done
          exit $failed
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test -- --ci

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # The OTA status report counts mobile commits on main: needs history.
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Bundle from a clean checkout (Android + iOS)
        # Catches source files that exist locally but were never committed
        # (e.g. gitignored src/widgets/android), which only fail on EAS.
        run: |
          npx expo export --platform android --output-dir /tmp/export-android
          npx expo export --platform ios --output-dir /tmp/export-ios
      - name: Expo config resolves (runtime + updates)
        run: npx expo config --type public > /dev/null
      - name: Report OTA status to Apex (stale-OTA alarm)
        # Main's fingerprints vs the live store builds + its mobile commits, so
        # Apex › OTA updates can show what main holds that nobody has received.
        # Skips with a warning until the secrets are set.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OTA_STATUS_URL: ${{ vars.OTA_STATUS_URL || 'https://api.unifesto.app' }}
          OTA_STATUS_SECRET: ${{ secrets.OTA_STATUS_SECRET }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: node scripts/ota-status-report.js

  ota-safe:
    # O7: does this PR keep main OTA-reachable? Fingerprints the PR (merge ref)
    # and its base; fails when the base matched a live store runtime in the
    # base's runtime-fingerprints.json and the PR does not. No EAS credentials.
    name: OTA-safe
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      # The only env var feeding app.config.js, so the only one in the fingerprint.
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
    steps:
      - name: Secret present
        id: secret
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "::warning title=OTA-safe::GOOGLE_MAPS_ANDROID_API_KEY secret is not set (or not shared with this PR), so fingerprints can't match production. Check skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ota-base
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            .ota-base/mobile/package-lock.json
      - name: Install head and base
        if: steps.secret.outputs.ok == 'true'
        run: |
          (cd mobile && npm ci)
          (cd .ota-base/mobile && npm ci)
      - name: Compare fingerprints with the live runtimes
        if: steps.secret.outputs.ok == 'true'
        working-directory: mobile
        run: node scripts/ota-ci-check.js ../.ota-base/mobile

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: websites/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit -p .

  space:
    needs: changes
    if: needs.changes.outputs.space == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: websites/space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/space/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit -p .

  apex:
    needs: changes
    if: needs.changes.outputs.apex == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: websites/apex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/apex/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit -p .

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, backend, mobile, ota-safe, web, space, apex]
    runs-on: ubuntu-latest
    steps:
      - name: Every affected job succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
