# Status checks for every PR, in ONE job: "CI passed", the
# single required check. GitHub bills each job rounded up to a whole minute, so
# separate changes/app/gate jobs cost ~4 billed minutes per run for ~2 of work
# (Oct 2026: 340 billed min per 80 runs vs ~196 as one job). Each app's checks
# only run when its folder (or this file) changed; a docs-only change runs just
# the filter. A push to main skips the checks its PR already ran (~40% of Oct
# 2026 minutes) and only reports OTA status. Every app step runs even if an earlier one failed, so one run
# reports every broken app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The org's default token is restricted; paths-filter needs to list PR files.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The OTA status report counts mobile commits on main: needs history.
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            backend:
              - *ci
              - 'backend/**'
              - 'scripts/any-guard.sh'
            mobile:
              - *ci
              - 'mobile/**'
            web:
              - *ci
              - 'websites/web/**'
            space:
              - *ci
              - 'websites/space/**'
            apex:
              - *ci
              - 'websites/apex/**'

      # ── mobile (Node 22) ────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.filter.outputs.mobile == 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Mobile
        if: ${{ !cancelled() && steps.filter.outputs.mobile == 'true' }}
        working-directory: mobile
        run: |
          npm ci
          # main already passed these on its PR's merge ref; push only needs the install for the OTA report.
          [ "$GITHUB_EVENT_NAME" = pull_request ] || exit 0
          echo "::group::Type-check"; npx tsc --noEmit; echo "::endgroup::"
          # Bundle from a clean checkout: catches source files that exist
          # locally but were never committed (e.g. gitignored
          # src/widgets/android), which only fail on EAS.
          echo "::group::Bundle (Android + iOS)"
          npx expo export --platform android --output-dir /tmp/export-android
          npx expo export --platform ios --output-dir /tmp/export-ios
          echo "::endgroup::"
          echo "::group::Expo config resolves (runtime + updates)"; npx expo config --type public > /dev/null; echo "::endgroup::"
      - name: Report OTA status to Apex (stale-OTA alarm)
        # Main's fingerprints vs the live store builds + its mobile commits, so
        # Apex › OTA updates can show what main holds that nobody has received.
        # Skips with a warning until the secrets are set.
        if: ${{ !cancelled() && steps.filter.outputs.mobile == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: mobile
        env:
          OTA_STATUS_URL: ${{ vars.OTA_STATUS_URL || 'https://api.unifesto.app' }}
          OTA_STATUS_SECRET: ${{ secrets.OTA_STATUS_SECRET }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: node scripts/ota-status-report.js

      # O7: does this PR keep main OTA-reachable? Fingerprints the PR (merge
      # ref) and its base; fails when the base matched a live store runtime in
      # the base's runtime-fingerprints.json and the PR does not. Reuses the
      # head install from the Mobile step. No EAS credentials.
      - name: OTA-safe · secret present
        id: ota
        if: ${{ !cancelled() && steps.filter.outputs.mobile == 'true' && github.event_name == 'pull_request' }}
        env:
          # The only env var feeding app.config.js, so the only one in the fingerprint.
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "::warning title=OTA-safe::GOOGLE_MAPS_ANDROID_API_KEY secret is not set (or not shared with this PR), so fingerprints can't match production. Check skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: ${{ !cancelled() && steps.ota.outputs.ok == 'true' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ota-base
      - name: OTA-safe
        if: ${{ !cancelled() && steps.ota.outputs.ok == 'true' }}
        working-directory: mobile
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          (cd ../.ota-base/mobile && npm ci)
          node scripts/ota-ci-check.js ../.ota-base/mobile

      # ── websites (Node 22) ──────────────────────────────────────────────
      # Each app also runs the production `next build` (J19): with
      # ignoreBuildErrors gone (#320) it is the same build the Dockerfile runs.
      # Env is dummy only: API URLs point at a local port (never prod; web's
      # fallback when unset is the prod API),
      # no Sentry DSN, and no SENTRY_AUTH_TOKEN, so withSentryConfig skips the
      # source-map upload. .next/cache is restored per lockfile, so a PR's
      # later pushes rebuild incrementally.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.filter.outputs.web == 'true' && github.event_name == 'pull_request' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/web/package-lock.json
      - uses: actions/cache@v6
        if: ${{ !cancelled() && steps.filter.outputs.web == 'true' && github.event_name == 'pull_request' }}
        with:
          path: websites/web/.next/cache
          key: next-web-${{ hashFiles('websites/web/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-web-${{ hashFiles('websites/web/package-lock.json') }}-
      - name: Web
        if: ${{ !cancelled() && steps.filter.outputs.web == 'true' && github.event_name == 'pull_request' }}
        working-directory: websites/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4999
          NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3000
          DEPLOYMENT_ID: ci
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci && npx next typegen && npx tsc --noEmit -p . && npm audit --omit=dev --audit-level=critical
          # Legal pages prerender from the API and throw when it's unreachable
          # (on purpose: keep the cached page). A stub that 404s everything
          # builds them as not-found instead.
          node -e "require('http').createServer((q,r)=>{r.writeHead(404,{'content-type':'application/json'});r.end('{}')}).listen(4999,'127.0.0.1')" &
          echo "::group::Build"; npm run build; echo "::endgroup::"

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.filter.outputs.space == 'true' && github.event_name == 'pull_request' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/space/package-lock.json
      - uses: actions/cache@v6
        if: ${{ !cancelled() && steps.filter.outputs.space == 'true' && github.event_name == 'pull_request' }}
        with:
          path: websites/space/.next/cache
          key: next-space-${{ hashFiles('websites/space/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-space-${{ hashFiles('websites/space/package-lock.json') }}-
      - name: Space
        if: ${{ !cancelled() && steps.filter.outputs.space == 'true' && github.event_name == 'pull_request' }}
        working-directory: websites/space
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4999
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4999
          NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APEX_URL: http://127.0.0.1:3002
          DEPLOYMENT_ID: ci
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci && npx next typegen && npx tsc --noEmit -p . && npm audit --omit=dev --audit-level=critical
          echo "::group::Build"; npm run build; echo "::endgroup::"

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.filter.outputs.apex == 'true' && github.event_name == 'pull_request' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/apex/package-lock.json
      - uses: actions/cache@v6
        if: ${{ !cancelled() && steps.filter.outputs.apex == 'true' && github.event_name == 'pull_request' }}
        with:
          path: websites/apex/.next/cache
          key: next-apex-${{ hashFiles('websites/apex/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-apex-${{ hashFiles('websites/apex/package-lock.json') }}-
      - name: Apex
        if: ${{ !cancelled() && steps.filter.outputs.apex == 'true' && github.event_name == 'pull_request' }}
        working-directory: websites/apex
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4999
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4999
          NEXT_PUBLIC_SPACE_URL: http://127.0.0.1:3001
          DEPLOYMENT_ID: ci
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci && npx next typegen && npx tsc --noEmit -p . && npm audit --omit=dev --audit-level=critical
          echo "::group::Build"; npm run build; echo "::endgroup::"

      # ── backend (Node 24, last so it doesn't change the others' Node) ───
      - name: Migrations have no destructive SQL without review
        # New migrations must be additive. DROP COLUMN / DROP TABLE fails the
        # build unless the file carries a `-- contract-step` comment (the
        # reviewed second half of an expand/contract change). Other destructive
        # SQL only warns. See remove_chat, 2026-09-25 (S37). deploy.sh runs the
        # same script on migrations pending on the server (J13).
        if: ${{ !cancelled() && steps.filter.outputs.backend == 'true' && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}" -- 'backend/prisma/migrations/*/migration.sql' || true)
          [ -z "$added" ] && { echo "No new migrations."; exit 0; }
          echo "New migrations:"; echo "$added"
          bash scripts/migration-guard.sh $added
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.filter.outputs.backend == 'true' && github.event_name == 'pull_request' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend
        if: ${{ !cancelled() && steps.filter.outputs.backend == 'true' && github.event_name == 'pull_request' }}
        working-directory: backend
        # Dummy values only: some services build Razorpay/S3 clients in their
        # constructors from process.env. Locally these come from backend/.env.
        env:
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci-not-a-secret
          RAZORPAY_WEBHOOK_SECRET: ci-not-a-secret
          AWS_REGION: ap-south-1
          S3_BUCKET_NAME: ci-bucket
        run: |
          npm ci
          npx prisma generate
          echo "::group::Type-check"; npx tsc --noEmit -p tsconfig.json; echo "::endgroup::"
          bash ../scripts/any-guard.sh
          echo "::group::Unit tests"; npm test -- --ci; echo "::endgroup::"
          echo "::group::Runtime deps: no critical advisories"; npm audit --omit=dev --audit-level=critical; echo "::endgroup::"
      - name: Backend · migrations replay, no schema drift
        # J19: every migration applies to an empty Postgres 16, and the result
        # matches schema.prisma, so a schema change without its migration fails.
        # Postgres runs via `docker run` here, not as a job `services:` entry:
        # a service starts on every run (docs-only, push to main) and services
        # can't read the paths filter.
        # The history has always differed from schema.prisma (db-push era
        # leftovers: FK actions, index names, admin_devices, users.gender, ...).
        # prisma/known-drift.sql pins that diff; any other diff fails. Fixing
        # old drift = add the migration, then regenerate the file with the
        # last command below (`--script > prisma/known-drift.sql`).
        if: ${{ !cancelled() && steps.filter.outputs.backend == 'true' && github.event_name == 'pull_request' }}
        working-directory: backend
        env:
          # Throwaway container on the runner (J14's guard only refuses RDS hosts).
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -p 5432:5432 postgres:16 > /dev/null
          for _ in $(seq 60); do docker exec pg pg_isready -U postgres -h 127.0.0.1 > /dev/null 2>&1 && break; sleep 1; done
          echo "::group::migrate deploy (empty DB)"; npx prisma migrate deploy; echo "::endgroup::"
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > /tmp/drift.sql
          diff -u prisma/known-drift.sql /tmp/drift.sql || {
            echo "::error file=backend/prisma/schema.prisma::schema.prisma and prisma/migrations disagree (diff above: + needs a migration). Add the migration; if you fixed known drift, regenerate backend/prisma/known-drift.sql."
            exit 1
          }
