# J19: one grouped PR per app per month (security PRs come separately and
# right away when Dependabot security updates are on in repo settings).
# Majors are skipped: Prisma 7 and TypeScript 7 bot PRs broke the build
# (#337, #338); majors are planned upgrades.
# Not mobile: Expo pins native versions per SDK (upgrade with
# `npx expo install --fix` on an SDK bump), and a bot bump of react-native or
# LiveKit broke npm ci in #330. No SDK/RN bump before 5.0.0 anyway.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /websites/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /websites/apex
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
